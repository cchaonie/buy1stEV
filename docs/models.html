<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>买第一辆电车 · 车型库</title>
    <style>
      :root {
        --border: #e5e7eb;
        --muted: #6b7280;
        --accent: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        color: #111827;
        background: #f9fafb;
      }
      header {
        padding: 24px 20px 12px;
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .controls {
        max-width: 1200px;
        margin: 0 auto;
        padding: 8px 20px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .controls input,
      .controls select {
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        background: #fff;
      }
      .controls input {
        flex: 1;
        min-width: 200px;
      }
      .count {
        color: var(--muted);
        font-size: 13px;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 40px;
      }
      .table-wrap {
        overflow-x: auto;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13.5px;
      }
      th,
      td {
        padding: 9px 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th {
        background: #f3f4f6;
        font-weight: 600;
        cursor: default;
        position: sticky;
        top: 0;
      }
      th.sortable {
        cursor: pointer;
      }
      th.sortable:hover {
        color: var(--accent);
      }
      td.hl {
        white-space: normal;
        max-width: 260px;
        color: #374151;
        vertical-align: top;
      }
      td.hl .hl-text {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.5;
        min-height: 4.5em;
      }
      td.hl.expanded .hl-text {
        display: block;
        overflow: visible;
      }
      td.hl .hl-toggle {
        display: none;
        margin-top: 2px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        font-size: 12px;
        line-height: 1.2;
        cursor: pointer;
      }
      td.hl .hl-toggle.show {
        display: inline-block;
      }
      td.adas {
        width: 220px;
        min-width: 220px;
        max-width: 220px;
        white-space: normal;
        color: #374151;
        vertical-align: top;
      }
      td.adas .adas-text {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.5;
      }
      td.adas.expanded .adas-text {
        display: block;
        overflow: visible;
      }
      td.adas .adas-toggle {
        display: none;
        margin-top: 2px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        font-size: 12px;
        line-height: 1.2;
        cursor: pointer;
      }
      td.adas .adas-toggle.show {
        display: inline-block;
      }
      td.recall {
        width: 320px;
        min-width: 320px;
        max-width: 320px;
        white-space: normal;
        vertical-align: top;
        color: #374151;
      }
      td.recall .recall-summary {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.5;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      td.recall .recall-details {
        display: none;
        margin-top: 8px;
      }
      td.recall.expanded .recall-details {
        display: block;
      }
      td.recall .recall-item {
        padding: 8px 0;
        border-top: 1px solid var(--border);
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      td.recall .recall-field {
        margin-top: 4px;
      }
      td.recall .recall-toggle {
        margin-top: 4px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        font-size: 12px;
        cursor: pointer;
      }
      td.recall a {
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      td a {
        color: var(--accent);
        text-decoration: none;
      }
      td.num {
        font-variant-numeric: tabular-nums;
      }
      td.logo {
        width: 44px;
      }
      td.logo img {
        height: 22px;
        width: auto;
        max-width: 36px;
        object-fit: contain;
        display: block;
      }
      .empty {
        color: var(--muted);
      }
      footer {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 40px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>买第一辆电车 · 车型库</h1>
      <div class="sub">
        数据由脚本自动抓取自各品牌官方源，仅供参考，以官方最新发布为准。
        <a href="index.html">阅读《买第一辆电车》购车指南</a>
      </div>
      <p id="recall-coverage-note" class="sub" data-audit-cutoff="2026-10-01">
        召回资料截至 2026-10-01
        按各官方来源的实际检索区间核验；“暂无已匹配记录”不代表从未召回，资料不保证历史绝对完整，详见
        README。
      </p>
    </header>

    <div class="controls">
      <input id="q" type="search" placeholder="搜索车型 / 亮点 / 召回…" />
      <select id="f-brand">
        <option value="">全部品牌</option>
      </select>
      <select id="f-powertrain">
        <option value="">全部动力类型</option>
      </select>
      <select id="f-category">
        <option value="">全部类别</option>
      </select>
      <span class="count" id="count"></span>
    </div>

    <main>
      <div class="table-wrap">
        <table id="tbl">
          <thead>
            <tr>
              <th data-k="logo">图标</th>
              <th data-k="brand">品牌</th>
              <th data-k="model">车型</th>
              <th data-k="powertrain">动力类型</th>
              <th data-k="category">类别</th>
              <th data-k="price_min" class="sortable">价格区间</th>
              <th data-k="range_cltc_km" class="sortable">续航(CLTC)</th>
              <th data-k="battery_type">电池类型</th>
              <th data-k="battery_kwh" class="sortable">电量(kWh)</th>
              <th data-k="adas">智驾</th>
              <th data-k="highlights">定位亮点</th>
              <th data-k="recall_history">召回信息</th>
              <th data-k="url">链接</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>

    <footer id="foot"></footer>

    <script id="recall-source-hosts" type="application/json">
      { "samr": ["www.samr.gov.cn"], "xiaomi": ["www.xiaomiev.com"] }
    </script>
    <script>
      const RECALL_HOSTS = JSON.parse(
        document.getElementById('recall-source-hosts').textContent,
      );
      const RECALL_KEYS = [
        'event_id',
        'notice_id',
        'source_id',
        'issuer',
        'title',
        'official_url',
        'announcement_date',
        'recall_start_date',
        'recall_number',
        'scope',
        'reason',
        'remedy',
        'verified_on',
      ];
      const recallCache = new WeakMap();
      const PRICE_LABEL = p =>
        p == null
          ? ''
          : p >= 10000
            ? (p / 10000).toFixed(p % 10000 ? 2 : 1).replace(/\.0$/, '') + '万'
            : p + '元';
      const fmtPrice = (lo, hi) =>
        lo == null && hi == null
          ? ''
          : PRICE_LABEL(lo) + (hi && hi !== lo ? ' – ' + PRICE_LABEL(hi) : '');
      const fmtRange = v => (v == null || v === '' ? '' : v + ' km');
      const fmtKwh = v => (v == null || v === '' ? '' : v);
      const LOGOS = {
        比亚迪: 'logos/byd.svg',
        小米: 'logos/xiaomi.svg',
        特斯拉: 'logos/tesla.svg',
        蔚来: 'logos/nio.png',
        小鹏: 'logos/xpeng.png',
        理想: 'logos/lixiang.png',
        极氪: 'logos/zeekr.png',
        问界: 'logos/aito.svg',
      };

      let data = [];
      let sortKey = null,
        sortDir = 1;

      function uniq(field) {
        return [...new Set(data.map(r => r[field]).filter(Boolean))].sort(
          (a, b) => a.localeCompare(b, 'zh'),
        );
      }
      function populateFilters() {
        const fill = (sel, field) => {
          const el = document.getElementById(sel);
          uniq(field).forEach(v => {
            const o = document.createElement('option');
            o.value = v;
            o.textContent = v;
            el.appendChild(o);
          });
        };
        fill('f-brand', 'brand');
        fill('f-powertrain', 'powertrain');
        fill('f-category', 'category');
      }

      function parseRecallHistory(record) {
        if (recallCache.has(record)) return recallCache.get(record);
        if (record.recall_history === '') {
          const empty = { items: [], error: false };
          recallCache.set(record, empty);
          return empty;
        }
        try {
          if (typeof record.recall_history !== 'string')
            throw new Error('not a string');
          const items = JSON.parse(record.recall_history);
          if (!Array.isArray(items) || items.length < 1 || items.length > 100)
            throw new Error('invalid item count');
          items.forEach(item => {
            if (
              !item ||
              Object.getPrototypeOf(item) !== Object.prototype ||
              Object.keys(item).sort().join('|') !==
                [...RECALL_KEYS].sort().join('|') ||
              RECALL_KEYS.some(
                key => typeof item[key] !== 'string' || item[key].length > 2048,
              )
            )
              throw new Error('invalid item shape');
          });
          const parsed = { items, error: false };
          recallCache.set(record, parsed);
          return parsed;
        } catch (error) {
          console.error(
            `召回信息格式错误：${record.brand} ${record.model}`,
            error,
          );
          const parsed = { items: [], error: true };
          recallCache.set(record, parsed);
          return parsed;
        }
      }

      function recallSearchText(record) {
        const parsed = parseRecallHistory(record);
        if (parsed.error) return '';
        return parsed.items
          .flatMap(item => [
            item.issuer,
            item.title,
            item.announcement_date,
            item.recall_start_date,
            item.recall_number,
            item.scope,
            item.reason,
            item.remedy,
          ])
          .join(' ');
      }

      function safeRecallUrl(item) {
        try {
          const url = new URL(item.official_url);
          const hosts = RECALL_HOSTS[item.source_id];
          if (
            url.protocol !== 'https:' ||
            url.username ||
            url.password ||
            (url.port && url.port !== '443') ||
            !Array.isArray(hosts) ||
            !hosts.includes(url.hostname) ||
            !url.pathname ||
            url.pathname === '/'
          )
            throw new Error('outside official source allowlist');
          return url.href;
        } catch (error) {
          console.error(`召回公告链接无效：${item.notice_id}`, error);
          return '';
        }
      }

      function appendRecallField(parent, label, value) {
        const field = document.createElement('div');
        field.className = 'recall-field';
        const strong = document.createElement('strong');
        strong.textContent = label + '：';
        field.appendChild(strong);
        field.appendChild(document.createTextNode(value));
        parent.appendChild(field);
      }

      function createRecallCell(record) {
        const td = document.createElement('td');
        td.className = 'recall';
        const parsed = parseRecallHistory(record);
        if (parsed.error) {
          td.classList.add('empty');
          td.textContent = '召回信息暂不可用';
          return td;
        }
        if (!parsed.items.length) {
          td.classList.add('empty');
          td.textContent = '暂无已匹配记录';
          return td;
        }
        const latest = parsed.items[0];
        const summary = document.createElement('div');
        summary.className = 'recall-summary';
        summary.textContent = `已匹配 ${parsed.items.length} 条记录 · ${latest.recall_start_date || latest.announcement_date} · ${latest.title}`;
        td.appendChild(summary);
        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'recall-toggle';
        toggle.textContent = '查看详情';
        td.appendChild(toggle);
        const details = document.createElement('div');
        details.className = 'recall-details';
        parsed.items.forEach(item => {
          const section = document.createElement('section');
          section.className = 'recall-item';
          appendRecallField(
            section,
            '公告日期',
            item.announcement_date || '官方未提供',
          );
          appendRecallField(
            section,
            '召回开始',
            item.recall_start_date || '官方未提供',
          );
          appendRecallField(
            section,
            '召回编号',
            item.recall_number || '官方未提供编号',
          );
          appendRecallField(section, '涉及范围', item.scope);
          appendRecallField(section, '原因', item.reason);
          appendRecallField(section, '措施', item.remedy);
          appendRecallField(section, '发布机构', item.issuer);
          const url = safeRecallUrl(item);
          if (url) {
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = '查看官方公告';
            section.appendChild(link);
          } else {
            appendRecallField(section, '公告链接', '官方链接暂不可用');
          }
          details.appendChild(section);
        });
        td.appendChild(details);
        toggle.addEventListener('click', () => {
          const expanded = td.classList.toggle('expanded');
          toggle.textContent = expanded ? '收起' : '查看详情';
        });
        return td;
      }

      function matches(r) {
        const q = document.getElementById('q').value.trim().toLowerCase();
        const b = document.getElementById('f-brand').value;
        const p = document.getElementById('f-powertrain').value;
        const c = document.getElementById('f-category').value;
        if (b && r.brand !== b) return false;
        if (p && r.powertrain !== p) return false;
        if (c && r.category !== c) return false;
        if (
          q &&
          !(r.model + ' ' + (r.highlights || '') + ' ' + recallSearchText(r))
            .toLowerCase()
            .includes(q)
        )
          return false;
        return true;
      }

      function render() {
        let rows = data.filter(matches);
        if (sortKey)
          rows.sort((a, b) => {
            const av = a[sortKey],
              bv = b[sortKey];
            if (av === bv) return 0;
            if (av == null || av === '') return 1;
            if (bv == null || bv === '') return -1;
            return (av > bv ? 1 : -1) * sortDir;
          });
        const tbody = document.querySelector('#tbl tbody');
        tbody.innerHTML = '';
        rows.forEach(r => {
          const tr = document.createElement('tr');
          const icon = document.createElement('td');
          icon.className = 'logo';
          const logo = LOGOS[r.brand];
          if (logo) {
            const img = document.createElement('img');
            img.src = logo;
            img.alt = r.brand;
            img.loading = 'lazy';
            icon.appendChild(img);
          }
          tr.appendChild(icon);
          const cells = [
            r.brand,
            r.model,
            r.powertrain,
            r.category,
            fmtPrice(r.price_min, r.price_max),
            fmtRange(r.range_cltc_km),
            r.battery_type,
            fmtKwh(r.battery_kwh),
            r.adas,
          ];
          cells.forEach((v, i) => {
            const td = document.createElement('td');
            if (i === 8) {
              td.className = 'adas';
              const adasText = document.createElement('span');
              adasText.className = 'adas-text';
              adasText.textContent = v == null ? '' : v;
              td.appendChild(adasText);
              const adasToggle = document.createElement('button');
              adasToggle.type = 'button';
              adasToggle.className = 'adas-toggle';
              adasToggle.textContent = '查看更多';
              adasToggle.addEventListener('click', () => {
                const expanded = td.classList.toggle('expanded');
                adasToggle.textContent = expanded ? '收起' : '查看更多';
              });
              td.appendChild(adasToggle);
            } else {
              td.textContent = v == null ? '' : v;
              if (i === 4 || i === 5 || i === 7) td.className = 'num';
            }
            tr.appendChild(td);
          });
          const hl = document.createElement('td');
          hl.className = 'hl';
          const hlText = document.createElement('span');
          hlText.className = 'hl-text';
          hlText.textContent = r.highlights || '';
          hl.appendChild(hlText);
          const hlToggle = document.createElement('button');
          hlToggle.type = 'button';
          hlToggle.className = 'hl-toggle';
          hlToggle.textContent = '查看更多';
          hlToggle.addEventListener('click', () => {
            const expanded = hl.classList.toggle('expanded');
            hlToggle.textContent = expanded ? '收起' : '查看更多';
          });
          hl.appendChild(hlToggle);
          tr.appendChild(hl);
          tr.appendChild(createRecallCell(r));
          const link = document.createElement('td');
          if (r.url) {
            const a = document.createElement('a');
            a.href = r.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = '查看';
            link.appendChild(a);
          }
          tr.appendChild(link);
          tbody.appendChild(tr);
        });
        tbody.querySelectorAll('td.hl, td.adas').forEach(td => {
          const t = td.querySelector('.hl-text, .adas-text');
          const btn = td.querySelector('.hl-toggle, .adas-toggle');
          if (t.scrollHeight > t.clientHeight + 1) btn.classList.add('show');
        });
        document.getElementById('count').textContent =
          `${rows.length} / ${data.length} 款`;
      }

      document.querySelectorAll('th.sortable').forEach(th => {
        th.addEventListener('click', () => {
          const k = th.dataset.k;
          if (sortKey === k) sortDir = -sortDir;
          else {
            sortKey = k;
            sortDir = 1;
          }
          render();
        });
      });
      ['q', 'f-brand', 'f-powertrain', 'f-category'].forEach(id =>
        document.getElementById(id).addEventListener('input', render),
      );

      fetch('data.json')
        .then(r => r.json())
        .then(rows => {
          data = rows;
          populateFilters();
          render();
          const latest = rows
            .map(r => r.fetched_at)
            .filter(Boolean)
            .sort()
            .slice(-1)[0];
          document.getElementById('foot').textContent =
            `共 ${rows.length} 款车型 · 数据来源：各品牌官方接口 · 最近采集：${latest || '—'} · 由脚本自动生成`;
        })
        .catch(e => {
          document.getElementById('count').textContent = '加载失败：' + e;
        });
    </script>
  </body>
</html>
