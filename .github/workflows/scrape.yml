name: scrape-and-publish

on:
  schedule:
    - cron: '30 1 * * *' # daily 01:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Scrape all brands
        run: python scrapers/run_all.py

      - name: Build site
        run: python site/build_site.py

      - name: Validate recall audit and generated data
        run: python -m scrapers.recalls.validate

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh vehicle data [skip ci]'
          file_pattern: 'data/* docs/*'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
